<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Türaufnahme">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Türaufnahme · E+S Brandschutz</title>
<style>
:root{
  --bg:#f2f2f7; --cell:#fff; --label:#000; --l2:rgba(60,60,67,.6); --l3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.2);
  --fill:rgba(118,118,128,.12); --press:#e5e5ea;
  --tint:#1f6cb0; --tintbg:rgba(31,108,176,.12); --navy:#1e486c;
  --green:#34c759; --greenT:#248a3d; --orange:#ff9500; --orangeT:#c25e00; --red:#ff3b30; --redT:#d70015; --indigo:#5856d6; --gray:#8e8e93;
  --r:22px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.3;letter-spacing:-.41px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button,label,summary{touch-action:manipulation;cursor:pointer;-webkit-user-select:none;user-select:none}
.hidden{display:none!important}
.vh{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
.ic{width:22px;height:22px;flex:none;display:block}

/* ---------- Navigationsleiste ---------- */
.nav{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);transition:background-color .25s,box-shadow .25s}
.nav.solid,.nav.scrolled{background:rgba(242,242,247,.82);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.nav.scrolled{box-shadow:0 .5px 0 rgba(0,0,0,.16)}
.nav-in{height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:0 16px;max-width:680px;margin:0 auto}
.nl{justify-self:start;display:flex;align-items:center;gap:8px}
.nr{justify-self:end;display:flex;align-items:center}
.nt{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;transition:opacity .2s}
.nav.lg .nt{opacity:0}
.nav.lg.tshow .nt{opacity:1}
.saved{font-size:13px;color:var(--l2);display:flex;align-items:center;gap:4px;transition:color .2s;letter-spacing:-.08px}
.saved .ic{width:15px;height:15px;stroke-width:2.6}
.saved.flash{color:var(--greenT);font-weight:600}

/* Glas-Knöpfe */
.gbtn{height:44px;min-width:44px;border:0;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;font-size:17px;font-weight:600;color:var(--label);
  background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);
  box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 2px 12px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.9)}
.gbtn.circ{width:44px;padding:0}
.gbtn.tint{color:var(--tint)}
.gbtn:active,.cap:active,.chip:active,.stp:active,.th:active{transform:scale(.96)}

/* ---------- Seite ---------- */
.pg{padding:4px 0 calc(116px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
.hero{padding:2px 20px 20px}
.brand{height:30px;display:block;margin:0 0 14px}
.lt{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px;margin:0}
.kbtn{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:4px 0 0;font-size:17px;color:var(--l2);max-width:100%;text-align:left}
.kbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbtn .ic{width:14px;height:14px;stroke-width:3;color:var(--l3)}
.hero.c{text-align:center;padding-top:36px}
.hero.c .brand{height:58px;margin:0 auto 22px}
.sub{font-size:17px;color:var(--l2);margin:8px 0 0}

/* ---------- Listen (inset grouped) ---------- */
.sec{margin:0 16px 30px}
.sh{font-size:13px;line-height:18px;color:var(--l2);text-transform:uppercase;letter-spacing:-.08px;padding:0 20px 7px}
.sf{font-size:13px;line-height:18px;color:var(--l2);padding:7px 20px 0;letter-spacing:-.08px}
.sf.warnf{color:var(--orangeT);font-weight:600}
.grp{background:var(--cell);border-radius:var(--r);overflow:hidden}
.grp+.grp{margin-top:12px}
.cell{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 18px;background:var(--cell);width:100%;border:0;margin:0;text-align:left;font-size:17px;color:var(--label);list-style:none}
.grp>.cell:not(:first-child)::before{content:"";position:absolute;top:0;left:18px;right:0;border-top:.5px solid var(--sep)}
.grp>.cell.ico:not(:first-child)::before{left:60px}
.grp>.row:not(:first-child)::before{left:80px}
button.cell:active,label.cell.link:active,summary.cell:active,label.cell.tap:active{background:var(--press)}
.cell .ct{flex:1;min-width:0}
.cell .cv{color:var(--l2);text-align:right;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chev{width:14px!important;height:14px!important;color:var(--l3);stroke-width:3}
.sq{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.sq .ic{width:18px;height:18px;stroke-width:2.2}
.cell.blk{display:block;padding:12px 16px}
.cell.ctr{justify-content:center;font-weight:600}
.cell.dest{justify-content:center;color:var(--redT)}
.cell.tintc{justify-content:center;color:var(--tint);font-weight:600}
.cell.step .ct{font-size:16px;letter-spacing:-.32px}
.cell.step img{width:30px;height:30px;border-radius:8px;flex:none;box-shadow:0 0 0 .5px rgba(0,0,0,.12)}

/* Eingabezeilen */
.fld .k{width:96px;flex:none}
.fld input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:17px;padding:10px 0;color:var(--label);caret-color:var(--tint);-webkit-appearance:none;appearance:none;border-radius:0}
input::placeholder,textarea::placeholder{color:var(--l3);opacity:1}
textarea{display:block;width:100%;border:0;outline:0;resize:none;font-size:17px;min-height:92px;background:transparent;caret-color:var(--tint);padding:2px 2px;line-height:1.35}

/* Auswahl-Kapseln */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 15px;border:0;border-radius:999px;background:var(--fill);color:var(--label);font-size:15px;font-weight:500;letter-spacing:-.24px;display:inline-flex;align-items:center;justify-content:center;transition:background-color .15s,color .15s}
.chip.on{background:var(--tint);color:#fff}
.gg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.gg .chip{height:44px;padding:0 2px;font-size:16px;font-weight:600}
.gg .chip.oth{font-size:15px}
.mk{font-size:13px;color:var(--l2);margin:0 2px 9px;text-transform:uppercase;letter-spacing:-.08px}
.seg{display:flex;background:var(--fill);border-radius:999px;padding:3px;gap:2px}
.seg .chip{flex:1;height:38px;background:transparent;font-weight:500}
.seg .chip.on{background:#fff;color:var(--label);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}

/* Stepper Nr. */
.nrc .k{flex:1}
.stepper{display:flex;align-items:center;gap:8px}
.stp{width:50px;height:42px;border:0;border-radius:999px;background:var(--fill);font-size:26px;font-weight:400;color:var(--label);display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
#nr{width:66px;height:42px;text-align:center;font-family:var(--round);font-size:21px;font-weight:700;border:0;border-radius:14px;background:var(--fill);outline:0;color:var(--label);-webkit-appearance:none;appearance:none;padding:0;letter-spacing:0}
#nr:focus{box-shadow:0 0 0 2px var(--tint)}

/* Fotos */
.pblock .ph .ct{font-weight:600}
.okb{color:var(--greenT)!important;font-weight:600}
.okb .ic{width:17px;height:17px;stroke-width:2.8}
.missv{color:var(--orangeT)!important;font-weight:600}
.camBig{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:999px;background:var(--tintbg);color:var(--tint);font-size:17px;font-weight:600}
.camBig .ic{width:24px;height:24px}
.camBig:active{background:rgba(31,108,176,.2)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.th{width:78px;height:78px;border-radius:14px;overflow:hidden;border:0;padding:0;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--l2);font-size:22px}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.add{background:var(--tintbg);color:var(--tint)}
.th.add .ic{width:28px;height:28px}
.th.spin{font-size:12px;font-weight:600;color:var(--tint);letter-spacing:-.08px;animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.45}to{opacity:1}}
.link .ct{color:var(--tint)}
.link .ic{color:var(--tint)}

/* Schalter */
.swl{position:relative;width:51px;height:31px;flex:none}
.swl input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;z-index:1;cursor:pointer}
.sw{position:absolute;inset:0;border-radius:999px;background:rgba(120,120,128,.16);transition:background-color .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .25s}
.swl input:checked+.sw{background:var(--green)}
.swl input:checked+.sw::after{transform:translateX(20px)}

/* Aufklappbereich */
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .chev{transition:transform .2s}
details.grp[open]>summary .chev{transform:rotate(90deg)}

/* ---------- Übersicht ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 16px 12px}
.tile{background:var(--cell);border-radius:var(--r);padding:13px 14px 12px}
.tile b{display:block;font-family:var(--round);font-size:30px;font-weight:700;line-height:1.1;letter-spacing:0}
.tile span{font-size:13px;color:var(--l2);letter-spacing:-.08px}
.tile.warn b{color:var(--orangeT)}
.stat{display:flex;flex-wrap:wrap;gap:6px 16px;padding:0 20px;margin:0 16px 28px;font-size:13px;color:var(--l2);letter-spacing:-.08px}
.stat span{display:inline-flex;align-items:center;gap:5px}
.stat .ic{width:15px;height:15px;stroke-width:2.4}
.stat .ok{color:var(--greenT);font-weight:600}
.stat .warn{color:var(--orangeT);font-weight:600}
.row{min-height:76px;padding:10px 14px 10px 14px}
.thumb{width:52px;height:52px;border-radius:12px;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;background:var(--fill);color:var(--l2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.miss{background:rgba(255,149,0,.14);color:var(--orange)}
.thumb .ic{width:24px;height:24px}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.r1{font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px;letter-spacing:-.41px}
.r2,.r3{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.r2{font-size:15px;color:var(--l2);letter-spacing:-.24px}
.r3{font-size:13px;color:var(--l3);letter-spacing:-.08px}
.badge{font-size:12px;font-weight:600;letter-spacing:-.08px;padding:2px 8px;border-radius:999px;color:var(--orangeT);background:rgba(255,149,0,.14)}
.empty{text-align:center;color:var(--l2);padding:26px 36px 30px}
.empty .ic{width:54px;height:54px;color:var(--l3);margin:0 auto 12px;stroke-width:1.5}
.empty b{display:block;color:var(--label);font-size:20px;font-weight:600;margin-bottom:4px}
.ver{text-align:center;color:var(--l3);font-size:12px;margin:8px 0 0;letter-spacing:0}
.note .ct{font-size:15px;letter-spacing:-.24px;line-height:1.35}

/* ---------- untere Leiste ---------- */
.tbfade{position:fixed;left:0;right:0;bottom:0;height:calc(104px + env(safe-area-inset-bottom));z-index:19;pointer-events:none;background:linear-gradient(rgba(242,242,247,0),rgba(242,242,247,.94) 58%)}
.tb{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:10px;padding:0 16px calc(12px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
.cap{flex:1;height:54px;border:0;border-radius:999px;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;white-space:nowrap}
.cap .ic{width:21px;height:21px;stroke-width:2.3}
.cap.pri{background:var(--tint);color:#fff;box-shadow:0 8px 20px rgba(31,108,176,.32)}
.cap.ok{background:var(--green);color:#fff}
.cap.glass{color:var(--label);background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.9)}
.cap.sec2{background:var(--fill);color:var(--tint)}
.cap.w{width:100%;flex:none}
.cap:disabled{opacity:.4}
.tb .cap.pri{flex:1.55}

/* Export */
.prog{height:6px;border-radius:999px;background:var(--fill);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;width:0;background:var(--tint);transition:width .2s}
.cap+.cap{margin-top:10px}

/* ---------- Großansicht ---------- */
#ov{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
#ov .ovt{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;color:#fff}
#ov .ovtitle{flex:1;text-align:center;font-size:15px;font-weight:600;letter-spacing:-.24px}
#ov .sc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:center;justify-content:center}
#ov .sc img{max-width:100%;max-height:100%;object-fit:contain;display:block}
#ov .sc.zoom{display:block}
#ov .sc.zoom img{max-width:none;max-height:none;width:300%}
#ov .ovb{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));color:rgba(255,255,255,.6);font-size:13px}
.gbtn.dark{background:rgba(72,72,74,.7);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.gbtn.dark.red{color:#ff453a}
.spacer{width:44px;flex:none}

/* ---------- Hinweis-Kapsel ---------- */
#toast{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 62px);z-index:60;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
#toast div{display:flex;align-items:center;gap:8px;background:rgba(28,28,30,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:11px 18px;border-radius:999px;font-size:15px;font-weight:600;letter-spacing:-.24px;box-shadow:0 8px 28px rgba(0,0,0,.22);max-width:100%;text-align:center;animation:tin .25s ease-out}
#toast div.err{background:rgba(215,0,21,.94);border-radius:18px}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov" class="hidden"></div>
<div id="toast"></div>
<input type="file" id="camInput" class="vh" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
<input type="file" id="libInput" class="vh" accept="image/*" multiple tabindex="-1" aria-hidden="true">

      if (!d.objectStoreNames.contains('thumbs')) d.createObjectStore('thumbs', { keyPath: 'id' });
    };

      if (d.photos.length !== before) { lost += before - d.photos.length; changed = true; }

  c.setUint16(12, this.time, true); c.setUint16(14, this.date, true); c.setUint32(16, crc, true); c.setUint32(20, size, true); c.setUint32(24, size, true);
  c.setUint16(28, nb.length, true); c.setUint16(30, 0, true); c.setUint16(32, 0, true); c.setUint16(34, 0, true); c.setUint16(36, 0, true);
  c.setUint32(38, 0, true); c.setUint32(42, this.offset, true);
  this.cd.push(c.buffer, nb); this.cdSize += 46 + nb.length;
  this.offset += 30 + nb.length + size; this.count++;
  if (this.parts.length >= 30) this.parts = [new Blob(this.parts)];
};
ZipWriter.prototype.finish = function () {
  var e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(4, 0, true); e.setUint16(6, 0, true); e.setUint16(8, this.count, true); e.setUint16(10, this.count, true);
  e.setUint32(12, this.cdSize, true); e.setUint32(16, this.offset, true); e.setUint16(20, 0, true);
  return new Blob(this.parts.concat(this.cd, [e.buffer]), { type: 'application/zip' });
};

function buildZip(onProgress) {
  var builtAt = nowISO();
  var nDoors = S.doors.length;
  return getAllMeta().then(function (metas) {
    var metaById = {}; metas.forEach(function (m) { metaById[m.id] = m; });
    var plan = planExport(metaById);
    var all = []; plan.forEach(function (e) { e.files.forEach(function (f) { all.push(f); }); });
    var zw = new ZipWriter(), okIds = {}, missing = [], i = 0;
    function step() {
      if (i >= all.length) return Promise.resolve();
      var f = all[i++];
      return getRec('photos', f.id).then(function (rec) {
        if (rec && rec.data) { zw.add(f.name, new Uint8Array(rec.data)); okIds[f.id] = 1; }
        else missing.push(f.name);
      }, function (e) { logErr('zip-photo', e); missing.push(f.name); }).then(function () {
        onProgress(all.length ? i / all.length : 1);
        return new Promise(function (r) { setTimeout(r, 0); });
      }).then(step);
    }
    return step().then(function () {
      zw.add('tueren.csv', utf8(buildCSV(plan)));
      zw.add('tueren.json', utf8(buildJSON(plan)));
      zw.add('uebersicht.html', utf8(buildOverview(plan, okIds)));
      var log = []; try { log = JSON.parse(localStorage.getItem(LOGKEY) || '[]'); } catch (e) {}
      if (missing.length) log.push('Fehlende Fotos beim Export: ' + missing.join(', '));
      if (log.length) zw.add('fehlerprotokoll.txt', utf8(log.join('\r\n') + '\r\nVersion ' + VERSION + '\r\n' + navigator.userAgent + '\r\n'));
      var blob = zw.finish();
      return { blob: blob, name: 'Tueraufnahme_' + (safeName(S.kunde) || 'Objekt') + '_' + stamp() + '.zip', builtAt: builtAt, nDoors: nDoors, missing: missing.length };
    });
  });
}
function buildZipUI() {
  if (zipState.building) return;
  zipState.building = true; zipState.p = 0; refreshZipArea();
  buildZip(function (p) { zipState.p = p; var pr = $('#zipProg'); if (pr) pr.style.width = Math.round(p * 100) + '%'; }).then(function (z) {
    lastZip = z;
    toast(z.missing ? 'ZIP fertig, aber ' + z.missing + ' Foto(s) fehlten' : '✓ ZIP fertig', z.missing ? 'err' : '', 3000);
  }, function (e) {
    logErr('zip', e); lastZip = null;
    toast('ZIP fehlgeschlagen: ' + errMsg(e), 'err', 7000);
  }).then(function () { zipState.building = false; refreshZipArea(); });
}
function markExported(z) { S.lastExport = { at: z.builtAt, count: z.nDoors }; saveState(); if ($('#zipArea')) renderExport(); }
function downloadBlob(blob, name) {
  var u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(u); }, 120000);
}
function shareFile(blob, name, type) {
  var file;
  try { file = new File([blob], name, { type: type }); } catch (e) { file = null; }
  if (file && navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
    return navigator.share({ files: [file] }).then(function () { return 'shared'; }, function (e) {
      if (e && e.name === 'AbortError') return 'aborted';
      logErr('share', e);
      toast('Teilen ging nicht – bitte „Herunterladen“ nehmen', 'err', 5000);
      return 'failed';
    });
  }
  downloadBlob(blob, name);
  return Promise.resolve('downloaded');
}

/* ================= Foto-Großansicht ================= */
var ovURL = null;
function closeOv() {
  if (ovURL) { URL.revokeObjectURL(ovURL); ovURL = null; }
  ov.innerHTML = ''; ov.classList.add('hidden');
}
function viewPhoto(id) {
  var d = null, idx = 0, tot = 0, kind = '';
  S.doors.forEach(function (x) { x.photos.forEach(function (p) { if (p.id === id) { d = x; kind = p.kind; } }); });
  if (d) { var same = d.photos.filter(function (p) { return p.kind === kind; }); tot = same.length; same.forEach(function (p, i) { if (p.id === id) idx = i + 1; }); }
  getRec('photos', id).then(function (rec) {
    if (!rec || !rec.data) { toast('Foto nicht gefunden', 'err'); return; }
    closeOv();
    ovURL = URL.createObjectURL(new Blob([rec.data], { type: rec.mime || 'image/jpeg' }));
    ov.innerHTML = '<div class="ovt"><button type="button" class="gbtn circ dark" data-ov="close" aria-label="Schließen">' + ic('xmark') + '</button>' +
      '<div class="ovtitle">' + esc((d ? kennung(d) + ' · ' : '') + (kind === 'typenschild' ? 'Typenschild' : 'Ganze Tür') + ' ' + idx + ' von ' + tot) + '</div><span class="spacer"></span></div>' +
      '<div class="sc" id="ovSc"><img src="' + ovURL + '" alt=""></div>' +
      '<div class="ovb"><span>Tippen zum Zoomen</span><button type="button" class="gbtn circ dark red" data-ov="del" data-id="' + esc(id) + '" aria-label="Foto löschen">' + ic('trash') + '</button></div>';
    ov.classList.remove('hidden');
  }).catch(function (e) { logErr('viewPhoto', e); toast('Foto konnte nicht geöffnet werden', 'err'); });
}
ov.addEventListener('click', function (e) {
  var b = e.target.closest('[data-ov]');
  if (b) {
    if (b.getAttribute('data-ov') === 'close') closeOv();
    else deletePhoto(b.getAttribute('data-id'));
    return;
  }
  var sc = e.target.closest('.sc');
  if (!sc) return;
  var img = sc.querySelector('img'); if (!img) return;
  if (sc.classList.contains('zoom')) { sc.classList.remove('zoom'); return; }
  var r = img.getBoundingClientRect();
  var rx = Math.min(1, Math.max(0, (e.clientX - r.left) / (r.width || 1))), ry = Math.min(1, Math.max(0, (e.clientY - r.top) / (r.height || 1)));
  sc.classList.add('zoom');
  sc.scrollLeft = rx * img.offsetWidth - sc.clientWidth / 2;
  sc.scrollTop = ry * img.offsetHeight - sc.clientHeight / 2;
});
function deletePhoto(id) {
  if (!confirm('Dieses Foto wirklich löschen?')) return;
  delPhotos([id]).then(function () {
    S.doors.forEach(function (d) {
      var before = d.photos.length;
      d.photos = d.photos.filter(function (p) { return p.id !== id; });
      if (d.photos.length !== before) touch(d);
    });
    saveState(); revokeThumb(id); closeOv(); renderPhotoSection();
    toast('Foto gelöscht');
  }, function (e) { logErr('deletePhoto', e); toast('Löschen fehlgeschlagen: ' + errMsg(e), 'err'); });
}

/* ================= Aktionen ================= */
var ACT = {
  'list': function () { go('list'); },
  'export': function () { go('export'); },
  'new': function () { var d = newDoor(); go('door', d.id); },
  'open': function (a) { go('door', a.getAttribute('data-id')); },
  'next': function () {
    var cur = findDoor(currentDoorId), g = cur ? cur.geschoss : null;
    leaveDoor();
    var d = newDoor(g);
    go('door', d.id);
    toast('Neue Tür ' + kennung(d));
  },
  'nr-': function () { var d = findDoor(currentDoorId); if (d) setNr(d, d.nr - 1); },
  'nr+': function () { var d = findDoor(currentDoorId); if (d) setNr(d, d.nr + 1); },
  'del-door': function () {
    var d = findDoor(currentDoorId); if (!d) return;
    if (!confirm('Tür ' + kennung(d) + (d.photos.length ? ' mit ' + d.photos.length + ' Foto(s)' : '') + ' wirklich löschen?')) return;
    var ids = d.photos.map(function (p) { return p.id; });
    S.doors = S.doors.filter(function (x) { return x.id !== d.id; });
    saveState();
    currentDoorId = null;
    delPhotos(ids).catch(function (e) { logErr('delDoorPhotos', e); });
    ids.forEach(revokeThumb);
    toast('Tür gelöscht');
    go('list');
  },
  'view-photo': function (a) { viewPhoto(a.getAttribute('data-id')); },
  'edit-kunde': function () {
    var v = prompt('Kunde / Objekt', S.kunde);
    if (v === null) return;
    v = v.trim(); if (!v) return;
    S.kunde = v; saveState(); renderList();
  },
  'start': function () {
    var v = ($('#kunde').value || '').trim();
    if (!v) { toast('Bitte Kunde eintragen', 'err'); $('#kunde').focus(); return; }
    S.kunde = v; if (!S.createdAt) S.createdAt = nowISO(); saveState(); requestPersist(); go('list');
  },
  'dismiss-hint': function () { S.hintDismissed = true; saveState(); renderList(); },
  'zip': function () { buildZipUI(); },
  'share-zip': function () {
    if (!lastZip) return;
    var z = lastZip;
    shareFile(z.blob, z.name, 'application/zip').then(function (r) { if (r === 'shared' || r === 'downloaded') { markExported(z); toast('✓ Export erledigt'); } });
  },
  'dl-zip': function () { if (lastZip) { downloadBlob(lastZip.blob, lastZip.name); markExported(lastZip); } },
  'share-csv': function () {
    if (!S.doors.length) { toast('Noch keine Türen'); return; }
    var plan = planExport({});
    var blob = new Blob([buildCSV(plan)], { type: 'text/csv' });
    shareFile(blob, 'Tuerliste_' + (safeName(S.kunde) || 'Objekt') + '_' + stamp() + '.csv', 'text/csv');
  }
};

/* ================= Ereignisse ================= */
app.addEventListener('click', function (e) {
  var cam = e.target.closest('[data-cam]');
  if (cam) {
    if (dbFailed) { e.preventDefault(); toast('Fotospeicher geht nicht – bitte Papier', 'err', 5000); return; }
    pendingCam = { doorId: currentDoorId, kind: cam.getAttribute('data-cam') };
    return; // Standardverhalten: Label öffnet Kamera
  }
  var chip = e.target.closest('.chip');
  if (chip && chip.parentElement) { onChip(chip); return; }
  var a = e.target.closest('[data-act]');
  if (a && ACT[a.getAttribute('data-act')]) { e.preventDefault(); ACT[a.getAttribute('data-act')](a); }
});
function onChip(chip) {
  var box = chip.parentElement, v = chip.getAttribute('data-v'), d = findDoor(currentDoorId);
  if (!d) return;
  var field = box.getAttribute('data-field'), fill = box.getAttribute('data-fill');
  if (field === 'geschoss') {
    var row = $('#gOtherRow'), other = $('#gOther');
    if (v === '__other') {
      markChips(box, '__other'); row.classList.remove('hidden'); other.focus();
      if (other.value.trim()) setGeschoss(d, other.value.trim());
      return;
    }
    row.classList.add('hidden'); other.value = '';
    markChips(box, v); setGeschoss(d, v);
    return;
  }
  if (field) {
    d[field] = d[field] === v ? '' : v;
    touch(d); saveState(); markChips(box, d[field]); updateMoreCnt(d);
    return;
  }
  if (fill) {
    var inp = document.getElementById(fill);
    d[fill] = d[fill] === v ? '' : v;
    if (inp) inp.value = d[fill];
    touch(d); saveState(); markChips(box, d[fill]); updateMoreCnt(d);
  }
}
app.addEventListener('input', function (e) {
  var t = e.target, d = findDoor(currentDoorId);
  if (!d) return;
  var f = t.getAttribute('data-text');
  if (f) {
    d[f] = t.value; touch(d); saveState();
    var box = app.querySelector('[data-fill="' + f + '"]'); if (box) markChips(box, t.value);
    updateMoreCnt(d);
    return;
  }
  if (t.id === 'gOther') { var g = t.value.trim(); if (g) setGeschoss(d, g); return; }
  if (t.id === 'nr') {
    var n = parseInt(String(t.value).replace(/\D/g, ''), 10);
    if (n >= 1 && n <= 9999) { d.nr = n; d.nrManual = true; touch(d); saveState(); updateKenn(d); }
  }
});
app.addEventListener('change', function (e) {
  var t = e.target, d = findDoor(currentDoorId);
  if (!d) return;
  if (t.getAttribute('data-chk') === 'keinTS') {
    d.keinTypenschild = t.checked; touch(d); saveState();
    var st = $('#photoSec .pblock .ph .cv');
    if (st && !hasTS(d)) { st.className = 'cv' + (d.keinTypenschild ? '' : ' missv'); st.textContent = d.keinTypenschild ? 'nicht vorhanden' : 'fehlt'; }
  }
  if (t.id === 'nr') t.value = d.nr;
});
app.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
    if (e.target.id === 'kunde') { ACT.start(); return; }
    e.target.blur();
  }
});

/* ================= Start ================= */
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    navigator.serviceWorker.register('sw.js').catch(function (e) { logErr('sw', e); });
    navigator.serviceWorker.addEventListener('controllerchange', function () { checkOffline(0); });
  } catch (e) { logErr('sw', e); }
}
function init() {
  registerSW();
  db().then(reconcile).catch(function (e) {
    logErr('db', e); dbFailed = errMsg(e);
  }).then(function () {
    var v = loadView();
    if (!S.kunde) go('setup');
    else if (v && v.view === 'door' && v.id && findDoor(v.id)) go('door', v.id);
    else if (v && v.view === 'export') go('export');
    else go('list');
  });
}
init();
})();
</script>
</body>
